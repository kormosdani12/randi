<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Randi?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="petals" aria-hidden="true"></div>

<main class="stage">

  <!-- 1. oldal - Kérdés -->
  <section class="page page--active" id="page-1" aria-labelledby="q-title">
    <div class="card question-card">
      <p class="eyebrow">Egy fontos kérdés</p>
      <h1 id="q-title">Eljössz velem randizni,<br>kicsim?</h1>
      <div class="answers">
        <button type="button" class="btn btn--yes" id="btn-yes">Igen</button>
        <button type="button" class="btn btn--no" id="btn-no" tabindex="-1" aria-hidden="true"><span class="no-label">Nem</span></button>
      </div>
      <p class="hint">(próbáld csak megnyomni a "Nem" gombot...)</p>
    </div>
  </section>

  <!-- 2. oldal - Randi program választás -->
  <section class="page" id="page-2" aria-labelledby="d-title">
    <div class="card wide-card">
      <p class="eyebrow">Válassz egyet</p>
      <h2 id="d-title">Mit csinálnál szívesen?</h2>
      <div class="date-grid">

        <button type="button" class="date-option" data-date="Állatkert">
          <span class="date-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="26" r="12" stroke="currentColor" stroke-width="2.2"/>
              <circle cx="14" cy="14" r="5" stroke="currentColor" stroke-width="2.2"/>
              <circle cx="34" cy="14" r="5" stroke="currentColor" stroke-width="2.2"/>
              <circle cx="19" cy="24" r="1.6" fill="currentColor"/>
              <circle cx="29" cy="24" r="1.6" fill="currentColor"/>
              <path d="M20 30c1.4 1.4 6.6 1.4 8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="date-name">Állatkert</span>
        </button>

        <button type="button" class="date-option" data-date="Mozi">
          <span class="date-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="8" y="10" width="32" height="28" rx="2" stroke="currentColor" stroke-width="2.2"/>
              <path d="M8 17h32M8 31h32" stroke="currentColor" stroke-width="2.2"/>
              <path d="M14 10l4 7M24 10l4 7M34 10l4 7" stroke="currentColor" stroke-width="2"/>
            </svg>
          </span>
          <span class="date-name">Mozi</span>
        </button>

        <button type="button" class="date-option" data-date="Esti autókázás">
          <span class="date-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 27l3-9a4 4 0 0 1 3.8-2.7h16.4A4 4 0 0 1 36 18l3 9" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
              <rect x="6" y="27" width="36" height="8" rx="2.5" stroke="currentColor" stroke-width="2.2"/>
              <circle cx="14" cy="35" r="3" stroke="currentColor" stroke-width="2.2"/>
              <circle cx="34" cy="35" r="3" stroke="currentColor" stroke-width="2.2"/>
              <circle cx="36" cy="9" r="4" stroke="currentColor" stroke-width="1.8"/>
            </svg>
          </span>
          <span class="date-name">Esti autókázás</span>
        </button>

        <button type="button" class="date-option" data-date="Szabadulószoba">
          <span class="date-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="12" y="21" width="24" height="17" rx="2.5" stroke="currentColor" stroke-width="2.2"/>
              <path d="M18 21v-6a6 6 0 0 1 12 0v6" stroke="currentColor" stroke-width="2.2"/>
              <circle cx="24" cy="29" r="2.4" stroke="currentColor" stroke-width="2"/>
              <path d="M24 31.5V34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="date-name">Szabadulószoba</span>
        </button>

      </div>
    </div>
  </section>

  <!-- 3. oldal - Időpont választás -->
  <section class="page" id="page-3" aria-labelledby="t-title">
    <div class="card">
      <p class="eyebrow">Már csak egy apróság</p>
      <h2 id="t-title">Mikor lenne neked jó?</h2>
      <form class="time-form" id="time-form">
        <div class="field-row">
          <label class="field">
            <span>Hónap</span>
            <select id="select-month" required>
              <option value="" disabled selected>Válassz</option>
            </select>
          </label>
          <label class="field">
            <span>Nap</span>
            <select id="select-day" required>
              <option value="" disabled selected>Válassz</option>
            </select>
          </label>
        </div>
        <button type="submit" class="btn btn--yes" id="btn-continue" disabled>Tovább</button>
      </form>
    </div>
  </section>

  <!-- 4. oldal - Záró üzenet -->
  <section class="page" id="page-4" aria-labelledby="f-title">
    <div class="card">
      <p class="eyebrow" id="final-eyebrow">Minden készen áll</p>
      <h2 id="f-title">A nap végén szeretném, ha eljönnél hozzám,<br>mert egy meglepetéssel is készültem Neked!</h2>
      <p class="summary" id="summary"></p>
    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
